services:
  # ─────────────────────────────────────────────
  # Nginx 反向代理
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/jinwenkey.com_nginx:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - jw-network

  # ─────────────────────────────────────────────
  # PostgreSQL 17
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    networks:
      - jw-network

  # ─────────────────────────────────────────────
  # Redis 8
  # ─────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: jw-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jw-network

  # ─────────────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: jw-api:latest
    container_name: jw-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # 容器内通过服务名 postgres 访问数据库
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SETUP_TOKEN_SECRET: ${SETUP_TOKEN_SECRET}
      # 腾讯云 SES（邮箱 OTP 验证码）
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION}
      TENCENT_SES_FROM: ${TENCENT_SES_FROM}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID}
      # 容器内通过服务名 redis 访问，密码来自 .env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # 支付宝（电脑网站支付）
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jw-network

  # ─────────────────────────────────────────────
  # Next.js Web（standalone 模式）
  # ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    image: jw-web:latest
    container_name: jw-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    networks:
      - jw-network

networks:
  jw-network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
